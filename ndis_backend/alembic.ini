# alembic.ini — Alembic configuration for NDIS Management System
# The sqlalchemy.url is set dynamically in migrations/env.py from app settings.
# Do not put credentials here.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Leave blank — overridden in env.py via settings.DATABASE_URL
sqlalchemy.url =

[post_write_hooks]
# hooks to run on newly generated revision scripts

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
